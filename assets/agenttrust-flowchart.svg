<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="100%" stop-color="#05070C" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <marker id="arrowCyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#06B6D4" />
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10B981" />
    </marker>
    <marker id="arrowViolet" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8B5CF6" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="520" fill="url(#flowBg)" rx="12" />

  <!-- Diagram Title -->
  <text x="40" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">
    AgentTrust Defense Architecture: 8-Stage Zero-Trust Execution Pipeline
  </text>
  <text x="40" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" fill="#64748B">
    Continuous Runtime Enforcement from LLM Token Ingestion to Space-Airgap Cryptographic Notarization
  </text>

  <!-- Stage 1: Autonomous Agent Input -->
  <g transform="translate(40, 100)" filter="url(#cardGlow)">
    <rect width="210" height="150" rx="8" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.5" />
    <rect x="0" y="0" width="210" height="6" rx="3" fill="#3B82F6" />
    <text x="16" y="32" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#60A5FA">STAGE 1: RUNTIME DISPATCH</text>
    <text x="16" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Agent Proposes Action</text>
    <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Tool invocation payload</text>
    <text x="16" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Cognitive Chain-of-Thought</text>
    <text x="16" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Parent delegation token</text>
    <rect x="16" y="130" width="178" height="1" fill="#1E293B" />
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="250" y1="175" x2="290" y2="175" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrowCyan)" />

  <!-- Stage 2: Ingress Defense & AST Scanner -->
  <g transform="translate(300, 100)" filter="url(#cardGlow)">
    <rect width="220" height="150" rx="8" fill="url(#cardGrad)" stroke="#06B6D4" stroke-width="1.5" />
    <rect x="0" y="0" width="220" height="6" rx="3" fill="#06B6D4" />
    <text x="16" y="32" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#22D3EE">STAGE 2: INGRESS GATEWAY</text>
    <text x="16" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Prompt &amp; AST Analysis</text>
    <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Unicode NFKC zero-width strip</text>
    <text x="16" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Aho-Corasick multi-pattern DFA</text>
    <text x="16" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• RFC CIDR Socket IMDS shield</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="520" y1="175" x2="560" y2="175" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrowCyan)" />

  <!-- Stage 3: Capability Semilattice & Action Scoping -->
  <g transform="translate(570, 100)" filter="url(#cardGlow)">
    <rect width="230" height="150" rx="8" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" />
    <rect x="0" y="0" width="230" height="6" rx="3" fill="#10B981" />
    <text x="16" y="32" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#34D399">STAGE 3: ACTION SCOPING</text>
    <text x="16" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Capability Semilattice</text>
    <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Verb extraction (SELECT vs DROP)</text>
    <text x="16" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Meet operator: C_child ⊑ C_parent</text>
    <text x="16" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Space Colonization swarm mesh</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="800" y1="175" x2="840" y2="175" stroke="#10B981" stroke-width="2" marker-end="url(#arrowEmerald)" />

  <!-- Stage 4: Bayesian Dynamic Blast Radius -->
  <g transform="translate(850, 100)" filter="url(#cardGlow)">
    <rect width="210" height="150" rx="8" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5" />
    <rect x="0" y="0" width="210" height="6" rx="3" fill="#F59E0B" />
    <text x="16" y="32" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#FBBF24">STAGE 4: RISK ASSESSMENT</text>
    <text x="16" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Bayesian Blast Radius</text>
    <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Dynamic risk belief network</text>
    <text x="16" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Count-Min Sketch frequency</text>
    <text x="16" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• If Score &gt; 0.70 ➔ Escalates</text>
  </g>

  <!-- Connecting Bus Downwards -->
  <path d="M 955 250 L 955 300 L 145 300 L 145 340" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowCyan)" />

  <!-- Stage 5: Dual-Lock Anti-Replay HITL Gate -->
  <g transform="translate(40, 340)" filter="url(#cardGlow)">
    <rect width="220" height="150" rx="8" fill="url(#cardGrad)" stroke="#EC4899" stroke-width="1.5" />
    <rect x="0" y="0" width="220" height="6" rx="3" fill="#EC4899" />
    <text x="16" y="32" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#F472B6">STAGE 5: HITL GOVERNANCE</text>
    <text x="16" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Single-Use HITL Nonce</text>
    <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• 1-Click human decision link</text>
    <text x="16" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Atomic nonce burn (Anti-409)</text>
    <text x="16" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• EU AI Act Art. 14 compliance</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <line x1="260" y1="415" x2="300" y2="415" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrowCyan)" />

  <!-- Stage 6: Post-Approval Runtime Watchdog -->
  <g transform="translate(310, 340)" filter="url(#cardGlow)">
    <rect width="230" height="150" rx="8" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-width="1.5" />
    <rect x="0" y="0" width="230" height="6" rx="3" fill="#8B5CF6" />
    <text x="16" y="32" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#A78BFA">STAGE 6: RUNTIME WATCHDOG</text>
    <text x="16" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Post-Approval Sidecar</text>
    <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Continuous syscall &amp; cloud monitor</text>
    <text x="16" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Sub-action trajectory tracking</text>
    <text x="16" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Auto-freeze on unexpected IAM drift</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <line x1="540" y1="415" x2="580" y2="415" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowViolet)" />

  <!-- Stage 7: Cryptographic Black Box Ledger -->
  <g transform="translate(590, 340)" filter="url(#cardGlow)">
    <rect width="220" height="150" rx="8" fill="url(#cardGrad)" stroke="#06B6D4" stroke-width="1.5" />
    <rect x="0" y="0" width="220" height="6" rx="3" fill="#06B6D4" />
    <text x="16" y="32" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#38BDF8">STAGE 7: AUDIT LEDGER</text>
    <text x="16" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">NIST FIPS 204 PQC</text>
    <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• RFC 8785 JSON Canonicalization</text>
    <text x="16" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Binary Merkle audit tree</text>
    <text x="16" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• ML-DSA lattice signatures</text>
  </g>

  <!-- Arrow 7 -> 8 -->
  <line x1="810" y1="415" x2="850" y2="415" stroke="#8B5CF6" stroke-width="2" marker-end="url(#arrowViolet)" />

  <!-- Stage 8: Orbital Space-Airgap Notary -->
  <g transform="translate(860, 340)" filter="url(#cardGlow)">
    <rect width="200" height="150" rx="8" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" />
    <rect x="0" y="0" width="200" height="6" rx="3" fill="#10B981" />
    <text x="16" y="32" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#34D399">STAGE 8: SPACE NOTARY</text>
    <text x="16" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">LEO Satellite Mesh</text>
    <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• 550km space-airgap HSM</text>
    <text x="16" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Doppler S-curve time dilation</text>
    <text x="16" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">• Quantum QKD entanglement</text>
  </g>
</svg>