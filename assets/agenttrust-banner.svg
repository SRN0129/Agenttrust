<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="violetCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowViolet" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#06B6D4" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#cyberGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="160" fill="#06B6D4" fill-opacity="0.08" filter="url(#glowCyan)" />
  <circle cx="950" cy="120" r="180" fill="#8B5CF6" fill-opacity="0.07" filter="url(#glowViolet)" />
  <circle cx="600" cy="300" r="140" fill="#10B981" fill-opacity="0.05" filter="url(#glowCyan)" />

  <!-- Left: Stylized Quantum Cryptographic Shield & Orbital Mesh -->
  <g transform="translate(80, 50)">
    <!-- Orbital Ellipse 1 -->
    <ellipse cx="130" cy="130" rx="125" ry="48" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6,4" transform="rotate(-25 130 130)" />
    <!-- Orbital Ellipse 2 (Cross Track) -->
    <ellipse cx="130" cy="130" rx="125" ry="48" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="8,4" transform="rotate(35 130 130)" />

    <!-- Satellite Node on Orbit -->
    <g transform="translate(225, 65)">
      <circle cx="0" cy="0" r="6" fill="#06B6D4" filter="url(#glowCyan)" />
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" />
      <!-- Solar Panels -->
      <line x1="-12" y1="0" x2="-6" y2="0" stroke="#06B6D4" stroke-width="2" />
      <line x1="6" y1="0" x2="12" y2="0" stroke="#06B6D4" stroke-width="2" />
      <rect x="-16" y="-4" width="4" height="8" fill="#38BDF8" rx="1" />
      <rect x="12" y="-4" width="4" height="8" fill="#38BDF8" rx="1" />
    </g>

    <!-- Main Outer Shield -->
    <path d="M 130 20 
             L 220 55 
             L 220 145 
             C 220 205 130 245 130 245 
             C 130 245 40 205 40 145 
             L 40 55 Z" 
          fill="url(#shieldFill)" 
          stroke="url(#cyanEmerald)" 
          stroke-width="3.5" 
          filter="url(#glowCyan)" />

    <!-- Inner Shield Inscription (Post-Quantum Lattice Wireframe) -->
    <path d="M 130 45 L 195 72 L 195 140 C 195 185 130 218 130 218 C 130 218 65 185 65 140 L 65 72 Z" 
          fill="none" 
          stroke="#1E293B" 
          stroke-width="1.5" />

    <!-- Quantum Lattice Cross Lines -->
    <line x1="130" y1="45" x2="130" y2="218" stroke="#06B6D4" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="3,3" />
    <line x1="65" y1="120" x2="195" y2="120" stroke="#06B6D4" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="3,3" />
    <line x1="75" y1="80" x2="185" y2="160" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4" />
    <line x1="75" y1="160" x2="185" y2="80" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4" />

    <!-- Center Keyhole / Trust Core -->
    <circle cx="130" cy="115" r="16" fill="#0F172A" stroke="url(#cyanEmerald)" stroke-width="2.5" />
    <polygon points="130,105 135,115 130,125 125,115" fill="#10B981" />
    <path d="M 127 122 L 133 122 L 135 138 L 125 138 Z" fill="url(#cyanEmerald)" />
    <circle cx="130" cy="113" r="3" fill="#FFFFFF" />
  </g>

  <!-- Right: Branding & Value Proposition Typography -->
  <g transform="translate(410, 75)">
    <!-- Security Classification Pill -->
    <g>
      <rect x="0" y="0" width="375" height="26" rx="13" fill="#0C1527" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="14" cy="13" r="4" fill="#10B981" filter="url(#glowCyan)" />
      <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.2">
        ZERO-TRUST RUNTIME &amp; CRYPTOGRAPHIC BLACK BOX
      </text>
    </g>

    <!-- Main Project Name -->
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" letter-spacing="-1">
      Agent<tspan fill="url(#cyanEmerald)">Trust</tspan>
    </text>

    <!-- Tagline -->
    <text x="2" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#94A3B8" letter-spacing="0.2">
      Hardware-Sealed Control Plane &amp; Post-Quantum Security Gateway for AI Swarms
    </text>

    <text x="2" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#64748B">
      Pre-Execution Action Scoping • Real-Time Cloud Watchdog • Single-Use HITL Nonce • NIST FIPS 204
    </text>

    <!-- Modern Feature Badges in SVG -->
    <g transform="translate(0, 168)">
      <!-- Badge 1: Post-Quantum -->
      <g transform="translate(0, 0)">
        <rect width="168" height="30" rx="6" fill="#131127" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.7" />
        <text x="12" y="19" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#C4B5FD">
          ⚛ NIST FIPS 204 (ML-DSA)
        </text>
      </g>

      <!-- Badge 2: EU AI Act -->
      <g transform="translate(178, 0)">
        <rect width="160" height="30" rx="6" fill="#0A1D1A" stroke="#10B981" stroke-width="1" stroke-opacity="0.7" />
        <text x="12" y="19" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#6EE7B7">
          ⚖ EU AI Act Art. 12 &amp; 14
        </text>
      </g>

      <!-- Badge 3: Orbital Space-Mesh -->
      <g transform="translate(348, 0)">
        <rect width="180" height="30" rx="6" fill="#0C1B2E" stroke="#0284C7" stroke-width="1" stroke-opacity="0.7" />
        <text x="12" y="19" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#7DD3FC">
          🛰 LEO Satellite Air-Gap
        </text>
      </g>

      <!-- Badge 4: OWASP -->
      <g transform="translate(538, 0)">
        <rect width="175" height="30" rx="6" fill="#1F1315" stroke="#F43F5E" stroke-width="1" stroke-opacity="0.6" />
        <text x="12" y="19" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#FDA4AF">
          🛡 OWASP Agentic Top 10
        </text>
      </g>
    </g>

    <!-- Framework Compatibility Row -->
    <g transform="translate(2, 222)">
      <text x="0" y="0" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#475569" letter-spacing="1">
        DROP-IN COMPATIBILITY:
      </text>
      <text x="160" y="0" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#38BDF8">
        LangChain  •  CrewAI  •  AutoGen  •  LlamaIndex  •  Model Context Protocol (MCP)  •  OpenAI Assistants
      </text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#cyanEmerald)" />
</svg>