name: Automated Community & Buyer Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-triage:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-respond to commercial inquiries and issues
        uses: actions/github-script@v9
        with:
          script: |
            const issue = context.payload.issue;
            const isCommercial = issue.title.toLowerCase().includes('commercial') || 
                               issue.title.toLowerCase().includes('acquisition') || 
                               issue.title.toLowerCase().includes('license') ||
                               issue.title.toLowerCase().includes('enterprise');

            let message = '';
            if (isCommercial) {
              message = `Thank you for your commercial inquiry regarding **AgentTrust**.\n\nThe maintainers (@SRN0129) have been notified and will follow up shortly to discuss enterprise licensing, integration requirements, or pilot deployments.\n\nPlease include any technical architecture constraints or deployment timelines relevant to your organization.`;
            } else {
              message = `Thank you for opening an issue.\n\nMaintainers will review your submission shortly. If reporting a sensitive security issue, please ensure confidential handling per [SECURITY.md](SECURITY.md).`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: message
            });
