name: AgentTrust CI & Automated Security Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday at 00:00 UTC to verify health and keep repository active
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Run Multi-Language Automated Tests & Cryptographic Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js Dependencies
        run: |
          npm ci
          npm --prefix client ci

      - name: Compile & Typecheck Frontend
        run: npm run build:client

      - name: Execute Core Test Suite (TypeScript)
        run: npm test

      - name: Run Cryptographic Integrity Benchmark
        run: npx tsx simulator/run_demo.ts

      - name: Execute Python SDK Tests
        run: |
          cd sdk-python
          python -m unittest discover -s tests -t .
        env:
          PYTHONPATH: .

      - name: Execute Go SDK Tests
        run: |
          cd sdk-go
          go test -v ./...

      - name: Execute Rust SDK Tests
        run: |
          cargo test --manifest-path sdk-rust/Cargo.toml
