name: Manage Stale Issues & Discussions

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue has been automatically marked as stale due to 60 days of inactivity. It will be closed in 7 days if no further activity occurs. Thank you for your support!'
          stale-pr-message: 'This pull request has been automatically marked as stale due to 60 days of inactivity. It will be closed in 7 days if no further activity occurs.'
          stale-issue-label: 'status:stale'
          stale-pr-label: 'status:stale'
          days-before-stale: 60
          days-before-close: 7
          exempt-issue-labels: 'commercial,buyer,pinned,security,enhancement'
