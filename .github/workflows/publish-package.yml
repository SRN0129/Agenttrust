name: Publish to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@srn0129'

      - name: Install dependencies
        run: |
          npm ci

      - name: Compile TypeScript & Build
        run: npm run build:server

      - name: Publish All Packages to GitHub Packages
        run: |
          npm publish --if-present || true
          npm publish --workspace=packages/orbital-notary --if-present || true
          npm publish --workspace=packages/space-killswitch --if-present || true
          npm publish --workspace=packages/doppler-ephemeris --if-present || true
          npm publish --workspace=packages/qkd-witness --if-present || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
